[project]
name = "meeting-memory"
version = "0.1.0"
description = "Turns meeting transcripts into time-aware, queryable memory with verbatim citations."
requires-python = ">=3.10"
dependencies = [
  "anthropic==1.9.0",
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "pydantic==2.11.10",
  "numpy==2.2.6",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers==5.1.1"]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_memory = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
